<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Task Tracker</h1>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="What do you need to do?" required>
      <button type="submit">Add</button>
    </form>

    <div id="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>

    <div id="footer">
      <p id="task-count"></p>
      <button type="button" id="clear-completed">Clear completed</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
